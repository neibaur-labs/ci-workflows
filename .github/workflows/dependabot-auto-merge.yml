# dependabot-auto-merge.yml
#
# Turns on GitHub's own auto-merge for Dependabot pull requests that contain
# only minor or patch npm updates. GitHub then merges the PR once every required
# status check passes. If a check fails, nothing merges and the PR stays open.
#
# Policy: neibaur-labs/agent-ops docs/dependabot-auto-merge.md. This is the only
# automated merge in the system. AI agents still never merge.
#
# What is NOT auto-merged, and waits for the maintainer:
#   - any PR containing a major update
#   - GitHub Actions updates (they change CI itself)
#   - any PR not opened by Dependabot
#
# Requires the repository setting "Allow auto-merge" (Settings > General).
# To stop it: turn that setting off, or disable this workflow
# (gh workflow disable dependabot-auto-merge.yml).
name: dependabot-auto-merge

on:
  pull_request:
    # A run that does not start is not billed, and a job that runs for 10
    # seconds bills a whole minute. npm updates change a manifest and the
    # lockfile; GitHub Actions updates change only .github/workflows, so
    # they never start a run that could do nothing.
    paths:
      - '**/package.json'
      - pnpm-lock.yaml

permissions: {}

jobs:
  enable-auto-merge:
    # The PR author, not github.actor: a human re-running the job must not
    # make a non-Dependabot PR eligible.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (npm minor and patch only)
        # update-type is the HIGHEST semver change in the PR, so a group that
        # contains any major update is excluded.
        if: >-
          steps.metadata.outputs.package-ecosystem == 'npm_and_yarn' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
           steps.metadata.outputs.update-type == 'version-update:semver-patch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Summary
        if: always()
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          {
            echo "### dependabot-auto-merge"
            echo "- ecosystem: ${ECOSYSTEM:-unknown}"
            echo "- highest update type: ${UPDATE_TYPE:-unknown}"
            echo "- dependencies: ${NAMES:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
